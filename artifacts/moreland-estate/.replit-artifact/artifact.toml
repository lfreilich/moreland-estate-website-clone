kind = "web"
previewPath = "/"
title = "Moreland Estate Management"
description = "A faithful, responsive recreation of Moreland Estate Management’s homepage with its published services, contact information, and original brand imagery."
version = "1.0.0"
id = "artifacts/moreland-estate"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20327

[services.development]
run = "pnpm --filter @workspace/moreland-estate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moreland-estate", "run", "build" ]
serve = "static"
publicDir = "artifacts/moreland-estate/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20327"
BASE_PATH = "/"
